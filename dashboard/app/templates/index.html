<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard IoT</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(90deg, #0F182C, #1C283C);
            color: #fff;
        }

        h1 {
            margin-bottom: 30px;
        }

        #container-mynavbar{
            background: linear-gradient(90deg, #172236, #1B263A);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            border-bottom: 1px solid #32425f;
        }

        #user_acount {
            display: flex;
            align-items: center;
            text-align: left;
            gap: 8px;
        }

        #crop_container {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 2px solid #4f46e5;
        overflow: hidden; /* Isso impede que a imagem "saia" do quadrado */
        display: flex;
        align-items: center;
        justify-content: center;
        }

        #crop_container .user-acount-avatar {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 40%; /*Move a imagem*/
        transform: scale(2); /* Aqui você define o zoom (1.5 = 150%) */
        }

        #user_acount_infos {
            display: flex;
            flex-direction: column;
            font-size: larger;
        }

        #container-main {
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            align-items: baseline;
        }

        .card {
            max-width: 600px;
            background: linear-gradient(90deg, #172236, #1B263A);
            border: 1px solid #818181;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 40px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .card-title {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: transparent;
        }

        th, td {
            font-size: small;
            padding: 15px;
            text-align: center;
        }

        th {
            background-color: transparent;
        }

        td:nth-child(n+3) {
            color: #0FC592;
        }

        tr{
            border-bottom: 1px solid #818181;
        }
    </style>
</head>
<body>

<nav id="container-mynavbar">
    <div id="user_acount">
        <div id="crop_container">
            <img src="static/conan_2.webp" className="user-acount-avatar" alt="Avatar" />
        </div>

        <div id="user_acount_infos">
            <span className="item-acount-description">
                <b>Monitor de Baterias</b>
            </span>
        </div>
    </div>
</nav>

<main id="container-main">
    <h1>Conan IoT Dashboard's</h1>

    <div id="tables"></div>
</main>

<script>
async function loadData() {
    try {
        const response = await fetch("/api/data");
        const devices = await response.json();

        const container = document.getElementById("tables");
        container.innerHTML = "";

        devices.forEach((device) => {

            const dados = device.Dados || [];

            // Ordena por canal (garante ordem correta)
            dados.sort((a, b) => a.I - b.I);

            // Divide em dois blocos
            const grupos = [
                dados.filter(d => d.I >= 1 && d.I <= 6),
                dados.filter(d => d.I >= 7 && d.I <= 12)
            ];

            grupos.forEach((grupo, indexGrupo) => {

                const card = document.createElement("div");
                card.className = "card";

                const inicio = indexGrupo === 0 ? 1 : 7;
                const fim = indexGrupo === 0 ? 6 : 12;

                card.style.cursor = "pointer";
                card.addEventListener("click", () => {
                    abrirGrafico(device.ID, inicio, fim);
                });

                const title = document.createElement("div");
                title.className = "card-title";
                title.textContent = `DESCESP ${device.ID} - ${String(inicio).padStart(2,"0")} à ${String(fim).padStart(2,"0")}`;
                card.appendChild(title);

                const table = document.createElement("table");
                table.innerHTML = `
                    <thead>
                        <tr>
                            <th>Canal</th>
                            <th>Tensão (V)</th>
                            <th>Temperatura (°C)</th>
                            <th>Umidade (%)</th>
                            <th>Data/Hora</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                `;

                const tbody = table.querySelector("tbody");

                // adiciona os canais existentes
                grupo.forEach((d) => {

                    const dataFormatada = new Date(d.timestamp * 1000)
                        .toLocaleString("pt-BR");

                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${d.I}</td>
                        <td>${d.Tensao ?? "—"}</td>
                        <td>${d.Temp ?? "—"}</td>
                        <td>${d.Umi ?? "—"}</td>
                        <td>${dataFormatada}</td>
                    `;
                    tbody.appendChild(row);
                });

                // completa canais ausentes até 6 linhas
                for (let i = grupo.length; i < 6; i++) {

                    const canal = inicio + i;

                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${canal}</td>
                        <td>—</td>
                        <td>—</td>
                        <td>—</td>
                        <td>—</td>
                    `;
                    tbody.appendChild(row);
                }

                card.appendChild(table);
                container.appendChild(card);
            });
        });

    } catch (err) {
        console.error("Erro ao carregar dados:", err);
    }
}

let chartInstance = null;

async function abrirGrafico(deviceId, inicio, fim) {

    const response = await fetch(`/api/history/${deviceId}/${inicio}/${fim}`);
    const data = await response.json();

    const modal = document.createElement("div");
    modal.style.position = "fixed";
    modal.style.top = "0";
    modal.style.left = "0";
    modal.style.width = "100%";
    modal.style.height = "100%";
    modal.style.background = "rgba(0,0,0,0.8)";
    modal.style.display = "flex";
    modal.style.alignItems = "center";
    modal.style.justifyContent = "center";

    const canvas = document.createElement("canvas");
    canvas.style.background = "linear-gradient(90deg, #172236, #1B263A)";
    canvas.style.border = "1px solid #818181";
    canvas.style.borderRadius = "12px";
    canvas.style.padding = "20px";
    canvas.width = 900;
    canvas.height = 500;

    modal.appendChild(canvas);
    document.body.appendChild(modal);

    modal.addEventListener("click", () => {
        modal.remove();
        if (chartInstance) chartInstance.destroy();
    });

    const ctx = canvas.getContext("2d");

    const datasets = [];

    Object.keys(data.canais).forEach(canal => {
        datasets.push({
            label: "Canal " + canal,
            data: data.canais[canal],
            borderWidth: 2,
            fill: false
        });
    });

    chartInstance = new Chart(ctx, {
        type: "line",
        data: {
            labels: data.timestamps.map(t =>
                new Date(t * 1000).toLocaleTimeString("pt-BR")
            ),
            datasets: datasets
        },
        options: {
            responsive: false,
            plugins: {
                legend: { position: "top" }
            },
            scales: {
                y: {
                    title: {
                        display: true,
                        text: "Tensão (V)"
                    }
                }
            }
        }
    });
}

// primeira carga
loadData();

// auto refresh
setInterval(loadData, 5000);
</script>

</body>
</html>

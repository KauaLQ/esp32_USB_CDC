<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard IoT</title>
    <link rel="icon" href="{{ url_for('static', path='conan_2.webp') }}" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(90deg, #0F182C, #1C283C);
            color: #fff;
        }

        h1 {
            margin-bottom: 30px;
        }

        #container-mynavbar{
            background: linear-gradient(90deg, #172236, #1B263A);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            border-bottom: 1px solid #32425f;
        }

        #user_acount {
            display: flex;
            align-items: center;
            text-align: left;
            gap: 8px;
        }

        #crop_container {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #4f46e5;
            overflow: hidden; /* Isso impede que a imagem "saia" do quadrado */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #crop_container .user-acount-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #user_acount_infos {
            display: flex;
            flex-direction: column;
            font-size: larger;
        }

        #container-main {
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            align-items: baseline;
        }

        .card {
            max-width: 600px;
            background: linear-gradient(90deg, #172236, #1B263A);
            border: 1px solid #32425f;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 40px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
        }

        .card:hover {
            transform: translateY(-5px) scale(1.02); /* Leve subida e zoom */
            box-shadow: 0 12px 25px rgba(0,0,0,0.5);
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-title {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: transparent;
        }

        th, td {
            font-size: small;
            padding: 15px;
            text-align: center;
        }

        th {
            background-color: transparent;
        }

        tr{
            border-bottom: 1px solid #818181;
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Cores para os valores de tensão */
        .text-normal {
            color: #0FC592;
            font-weight: bold;
        }

        .text-critical {
            color: #ff4d4d;
            font-weight: bold;
        }

        /* Classe para esmaecer a linha */
        .faded-row td{
            opacity: 0.3; /* Nível de transparência (0.1 a 1.0) */
            transition: opacity 0.5s ease; /* Suaviza a transição quando o dado mudar */
        }

        /* Garante que o hover não "anule" o esmaecimento de forma brusca */
        .faded-row:hover {
            opacity: 0.5;
        }

        /* Estilos do Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(90deg, #172236, #1B263A);
            border: 1px solid #818181;
            border-radius: 12px;
            padding: 50px;
            position: relative;
            width: 90%;            /* Ocupa 90% da tela em dispositivos menores */
            max-width: 800px;     /* Não passa de 1000px em telas grandes */
            height: 400px;         /* Altura fixa para o gráfico respirar */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Quando o pai (overlay) estiver ativo, o conteúdo volta ao tamanho normal */
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-title{
            align-self: baseline;
            justify-self: flex-start;
        }

        .modal-subtitle {
            font-size: 12px;
            color: #8e96a5;
            margin: 10px 0px 10px 0px;
            align-self: baseline;
            justify-self: flex-start;
        }

        #chartCanvas {
            width: 100% !important;  /* Força ocupar toda a largura do modal-content */
            height: 100% !important; /* Força ocupar toda a altura do modal-content */
        }

        .close-button {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: red;
        }

        .close-button:hover {
            transition: color 0.2s;
            color: darkred;
        }
    </style>
</head>
<body>

<nav id="container-mynavbar">
    <div id="user_acount">
        <div id="crop_container">
            <img src="{{ url_for('static', path='conan_2.webp') }}" class="user-acount-avatar" alt="Avatar">
        </div>

        <div id="user_acount_infos">
            <span className="item-acount-description">
                <b>Monitor de Baterias</b>
            </span>
        </div>
    </div>
</nav>

<main id="container-main">
    <h1>Conan IoT Dashboard's</h1>

    <div id="tables"></div>

    <div id="chartModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-title">Gráfico de Tensões ao longo do tempo</span>
            <span class="modal-subtitle">Clique nos canais abaixo para mostrar/ocultar</span>
            <span class="close-button">&times;</span>
            <canvas id="chartCanvas"></canvas>
        </div>
    </div>

    <div id="channelModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-title" id="channelModalTitle">Histórico do Canal</span>
            <span class="modal-subtitle">Monitoramento de Tensão, Temperatura e Umidade</span>
            <span class="close-button">&times;</span>
            <canvas id="channelCanvas"></canvas>
        </div>
    </div>
</main>

<script>
async function loadData() {
    try {
        const response = await fetch("/api/data");
        const devices = await response.json();

        const container = document.getElementById("tables");
        container.innerHTML = "";

        devices.forEach((device) => {

            const dados = device.Dados || [];

            // Ordena por canal (garante ordem correta)
            dados.sort((a, b) => a.I - b.I);

            // Divide em dois blocos
            const grupos = [
                dados.filter(d => d.I >= 1 && d.I <= 6),
                dados.filter(d => d.I >= 7 && d.I <= 12)
            ];

            grupos.forEach((grupo, indexGrupo) => {

                const card = document.createElement("div");
                card.className = "card";

                const inicio = indexGrupo === 0 ? 1 : 7;
                const fim = indexGrupo === 0 ? 6 : 12;

                card.style.cursor = "pointer";
                card.addEventListener("click", () => {
                    abrirGrafico(device.ID, inicio, fim);
                });

                const title = document.createElement("div");
                title.className = "card-title";
                title.textContent = `DESCESP ${device.ID} - ${String(inicio).padStart(2,"0")} à ${String(fim).padStart(2,"0")}`;
                card.appendChild(title);

                const table = document.createElement("table");
                table.innerHTML = `
                    <thead>
                        <tr>
                            <th>Canal</th>
                            <th>Tensão (V)</th>
                            <th>Temperatura (°C)</th>
                            <th>Umidade (%)</th>
                            <th>Data/Hora</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                `;

                const tbody = table.querySelector("tbody");

                // adiciona os canais existentes
                grupo.forEach((d) => {
                    const dataFormatada = new Date(d.timestamp * 1000).toLocaleString("pt-BR");
                    const row = document.createElement("tr");

                    // --- CONFIGURAÇÃO DE LIMITES ---
                    const tensao = parseFloat(d.Tensao);
                    const limiteCritico = 15.0; // Abaixo disso fica Vermelho
                    const limiteFading = 16.0;  // Abaixo disso a linha esmaece
                    
                    let classeCor = "";
                    
                    if (!isNaN(tensao)) {
                        // Define a cor do texto
                        classeCor = tensao < limiteCritico ? "text-critical" : "text-normal";
                        
                        // Define se a linha esmaece (valor muito baixo ou crítico)
                        if (tensao < limiteFading) {
                            row.classList.add("faded-row");
                        }
                    }
                    // ------------------------------
                    
                    // Estilo para indicar que a linha é clicável
                    row.style.cursor = "cell"; 

                    row.innerHTML = `
                        <td>${d.I}</td>
                        <td class="${classeCor}">${d.Tensao ?? "—"}</td>
                        <td>${d.Temp ?? "—"}</td>
                        <td>${d.Umi ?? "—"}</td>
                        <td>${dataFormatada}</td>
                    `;

                    // EVENTO DE CLIQUE NA LINHA
                    row.addEventListener("click", (e) => {
                        e.stopPropagation(); // IMPEDE de abrir o modal do card (pai)
                        abrirGraficoCanal(device.ID, d.I);
                    });

                    tbody.appendChild(row);
                });

                // completa canais ausentes até 6 linhas
                for (let i = grupo.length; i < 6; i++) {

                    const canal = inicio + i;

                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${canal}</td>
                        <td>—</td>
                        <td>—</td>
                        <td>—</td>
                        <td>—</td>
                    `;
                    tbody.appendChild(row);
                }

                card.appendChild(table);
                container.appendChild(card);
            });
        });

    } catch (err) {
        console.error("Erro ao carregar dados:", err);
    }
}

// Variáveis globais para controlar o modal
const modal = document.getElementById("chartModal");
const canvas = document.getElementById("chartCanvas");
const ctx = canvas.getContext("2d");
let chartInstance = null;

const channelModal = document.getElementById("channelModal");
const channelCanvas = document.getElementById("channelCanvas");
let channelChartInstance = null;

// Lógica para fechar qualquer modal ao clicar fora
window.addEventListener("click", (e) => {
    if (e.target.classList.contains('modal-overlay') || e.target.classList.contains('close-button')) {
        const modalToClose = e.target.closest('.modal-overlay') || e.target;
        modalToClose.classList.remove("active");
        
        // Destruir instâncias após a animação
        setTimeout(() => {
            if (modalToClose.id === "chartModal" && chartInstance) {
                chartInstance.destroy(); chartInstance = null;
            }
            if (modalToClose.id === "channelModal" && channelChartInstance) {
                channelChartInstance.destroy(); channelChartInstance = null;
            }
        }, 400);
    }
});

async function abrirGraficoCanal(deviceId, channelIndex) {
    try {
        const response = await fetch(`/api/history/channel/${deviceId}/${channelIndex}`);
        const data = await response.json();

        document.getElementById("channelModalTitle").textContent = `DESCESP ${deviceId} - Canal ${String(channelIndex).padStart(2, "0")}`;
        channelModal.classList.add("active");

        if (channelChartInstance) channelChartInstance.destroy();

        channelChartInstance = new Chart(channelCanvas.getContext("2d"), {
            type: "line",
            data: {
                labels: data.timestamps.map(t => new Date(t * 1000).toLocaleTimeString("pt-BR")),
                datasets: [
                    {
                        label: "Tensão (V)",
                        data: data.tensao,
                        borderColor: "#4f46e5",
                        backgroundColor: "#4f46e5",
                        yAxisID: 'y',
                    },
                    {
                        label: "Temp (°C)",
                        data: data.temp,
                        borderColor: "#ff9f43",
                        backgroundColor: "#ff9f43",
                        yAxisID: 'y1',
                    },
                    {
                        label: "Umi (%)",
                        data: data.umi,
                        borderColor: "#0fc592",
                        backgroundColor: "#0fc592",
                        yAxisID: 'y2',
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#fff' } } },
                scales: {
                    y: { // Tensão
                        type: 'linear', display: true, position: 'left',
                        ticks: { color: '#4f46e5' },
                        grid: { color: 'rgba(255,255,255,0.1)' }
                    },
                    y1: { // Temperatura
                        type: 'linear', display: true, position: 'right',
                        ticks: { color: '#ff9f43' },
                        grid: { drawOnChartArea: false } // evita bagunça de linhas
                    },
                    y2: { // Umidade
                        type: 'linear', display: true, position: 'right',
                        offset: true,
                        ticks: { color: '#0fc592' },
                        grid: { drawOnChartArea: false }
                    },
                    x: { ticks: { color: '#fff' } }
                }
            }
        });
    } catch (err) {
        console.error("Erro ao carregar canal:", err);
    }
}

async function abrirGrafico(deviceId, inicio, fim) {
    try {
        const response = await fetch(`/api/history/${deviceId}/${inicio}/${fim}`);
        const data = await response.json();

        // Mostra o modal
        modal.classList.add("active");

        // Se já houver um gráfico, destrói antes de criar o novo
        if (chartInstance) chartInstance.destroy();

        const datasets = Object.keys(data.canais).map(canal => ({
            label: "Canal " + canal,
            data: data.canais[canal],
            borderWidth: 2,
            fill: false,
            borderColor: getRandomColor() // Opcional: função para cores diferentes
        }));

        chartInstance = new Chart(ctx, {
            type: "line",
            data: {
                labels: data.timestamps.map(t =>
                    new Date(t * 1000).toLocaleTimeString("pt-BR")
                ),
                datasets: datasets
            },
            options: {
                responsive: true, // Mudei para true para melhor ajuste
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: "top", labels: { color: '#fff' } }
                },
                scales: {
                    y: {
                        ticks: { color: '#fff' },
                        title: { display: true, text: "Tensão (V)", color: '#fff' }
                    },
                    x: { ticks: { color: '#fff' } }
                }
            }
        });
    } catch (err) {
        console.error("Erro ao carregar histórico:", err);
    }
}

// Função auxiliar para cores (opcional)
function getRandomColor() {
    const letters = '0123456789ABCDEF';
    let color = '#';
    for (let i = 0; i < 6; i++) color += letters[Math.floor(Math.random() * 16)];
    return color;
}

// primeira carga
loadData();

// auto refresh
setInterval(loadData, 5000);
</script>

</body>
</html>

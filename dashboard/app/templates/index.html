<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard IoT</title>
    <link rel="icon" href="{{ url_for('static', path='conan_2.webp') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='index.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', path='index.js') }}" defer></script>
</head>
<body>

<nav id="container-mynavbar">
    <div id="user_content">
        <div id="user_acount">
            <div id="crop_container">
                <img src="{{ url_for('static', path='conan_2.webp') }}" class="user-acount-avatar" alt="Avatar">
            </div>

            <div id="user_acount_infos">
                <span className="item-acount-description">
                    <b>Monitor de Baterias</b>
                </span>
            </div>
        </div>
        <div id="user_buttons">
            <button class="mybutton"><i class="fa-solid fa-gear"></i>  Config</button>
            <p id="user_msg_description"><span class="user-msg-one">Olá, </span><span class="user-msg-two"><b>Administrador</b></span></p>
            <button class="mybutton"><i class="fa-solid fa-arrow-right-from-bracket"></i>  Sair</button>
        </div>
    </div>
    
</nav>

<main id="container-main">
    <h1>Conan IoT Dashboard</h1>

    <div id="tables"></div>

    <div id="chartModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-title">Gráfico de Tensões ao longo do tempo</span>
            <span class="modal-subtitle">Clique nos canais abaixo para mostrar/ocultar</span>
            <span class="close-button">&times;</span>
            <canvas id="chartCanvas"></canvas>
        </div>
    </div>

    <div id="channelModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-title" id="channelModalTitle">Histórico do Canal</span>
            <span class="modal-subtitle">Monitoramento de Tensão, Temperatura e Umidade</span>
            <span class="close-button">&times;</span>
            <canvas id="channelCanvas"></canvas>
        </div>
    </div>
</main>
</body>
</html>
